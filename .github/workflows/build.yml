
name: Build Xorvila GDrive Backup

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source ZIP
        run: |
          unzip -q gdrive-backup-fabric-1.5.1-android-source.zip -d source

      - name: Download Android ARM64 Cloudflare
        working-directory: source/gdrive-fabric-1.4-work
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://packages-cf.termux.dev/apt/termux-main"
          curl -fsSL "$BASE/dists/stable/main/binary-aarch64/Packages" -o /tmp/packages
          python3 - <<'PY'
          import hashlib
          p = open('/tmp/packages').read()
          for block in p.split('\n\n'):
              fields = dict(line.split(': ',1) for line in block.splitlines() if ': ' in line and not line.startswith(' '))
              if fields.get('Package') == 'cloudflared':
                  open('/tmp/pkginfo','w').write(fields['Filename']+'\n'+fields['SHA256'])
                  break
          else:
              raise SystemExit('cloudflared package not found')
          PY
          mapfile -t META < /tmp/pkginfo
          curl -fsSL "$BASE/${META[0]}" -o /tmp/cloudflared.deb
          echo "${META[1]}  /tmp/cloudflared.deb" | sha256sum -c -
          mkdir -p /tmp/cf
          dpkg-deb -x /tmp/cloudflared.deb /tmp/cf
          BIN="$(find /tmp/cf -type f -path '*/bin/cloudflared' | head -1)"
          test -n "$BIN"
          mkdir -p src/main/resources/natives/android-arm64
          install -m 700 "$BIN" src/main/resources/natives/android-arm64/cloudflared

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build JAR
        working-directory: source/gdrive-fabric-1.4-work
        run: gradle --no-daemon clean build

      - uses: actions/upload-artifact@v4
        with:
          name: Xorvila-GDrive-Backup-1.5.1
          path: source/gdrive-fabric-1.4-work/build/libs/*.jar
          if-no-files-found: error
          
