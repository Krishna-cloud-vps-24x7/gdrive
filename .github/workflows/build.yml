
name: Build Xorvila GDrive Backup

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP found in repository root"
            exit 1
          fi

          echo "Extracting: $ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source

          BUILD_FILE="$(find source -type f -name build.gradle -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found inside ZIP"
            find source -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project: $PROJECT_DIR"

      - name: Download Android ARM64 Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://packages-cf.termux.dev/apt/termux-main"

          echo "Fetching Termux ARM64 package index..."
          curl -fsSL \
            "$BASE/dists/stable/main/binary-aarch64/Packages" \
            -o /tmp/packages

          python3 - <<'PY'
          p = open('/tmp/packages').read()

          for block in p.split('\n\n'):
              fields = {}
              for line in block.splitlines():
                  if ': ' in line and not line.startswith(' '):
                      key, value = line.split(': ', 1)
                      fields[key] = value

              if fields.get('Package') == 'cloudflared':
                  if 'Filename' not in fields or 'SHA256' not in fields:
                      raise SystemExit('Package metadata incomplete')

                  with open('/tmp/pkginfo', 'w') as f:
                      f.write(fields['Filename'] + '\n')
                      f.write(fields['SHA256'] + '\n')
                  break
          else:
              raise SystemExit('Android ARM64 cloudflared package not found')
          PY

          mapfile -t META < /tmp/pkginfo

          curl -fsSL "$BASE/${META[0]}" \
            -o /tmp/cloudflared.deb

          echo "${META[1]}  /tmp/cloudflared.deb" | sha256sum -c -

          mkdir -p /tmp/cf
          dpkg-deb -x /tmp/cloudflared.deb /tmp/cf

          BIN="$(find /tmp/cf -type f -name cloudflared -print -quit)"

          if [ -z "$BIN" ]; then
            echo "ERROR: cloudflared executable not found"
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/src/main/resources/natives/android-arm64"

          install -m 755 "$BIN" \
            "$PROJECT_DIR/src/main/resources/natives/android-arm64/cloudflared"

          echo "Android ARM64 Cloudflare packaged successfully"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon clean build

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR/build/libs" -maxdepth 1 -name '*.jar' -type f
          test -n "$(find "$PROJECT_DIR/build/libs" -maxdepth 1 -name '*.jar' -type f -print -quit)"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xorvila-GDrive-Backup-1.5.1-Android
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
